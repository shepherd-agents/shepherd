[project]
name = "shepherd-citation-checker"
version = "0.1.0"
description = "Evidence-linked bibliography checking as a composable Shepherd workflow"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["shepherd>=0.3.0,<0.4", "shepherd-dialect>=0.3.0,<0.4", "pdfplumber>=0.11,<0.12", "beautifulsoup4>=4.12,<5"]

[project.scripts]
shepherd-check-citations = "shepherd_citation_checker.cli:main"

[project.entry-points."shepherd.packages"]
citation_checker = "shepherd_citation_checker.registration"

[dependency-groups]
test = ["pytest>=8.0,<9.0", "reportlab>=4.5,<5.0"]
lint = ["ruff>=0.15,<1.0"]

[tool.uv.sources]
shepherd = { workspace = true }
shepherd-dialect = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shepherd_citation_checker"]
